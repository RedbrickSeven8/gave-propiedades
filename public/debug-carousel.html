<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Carousel</title>
    <style>
        .crossfade-carousel {
          position: relative;
          width: 500px;
          height: 500px;
        }

        .crossfade-carousel img {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
          opacity: 0;
          transition: opacity 0.5s ease-in-out;
        }

        .crossfade-carousel img.active {
          opacity: 1;
        }
    </style>
</head>
<body>
    <h1>Carousel Test</h1>
    <div class="crossfade-carousel">
        <img src="/img-asesora-1.png" alt="Asesora 1" class="active">
        <img src="/img-asesora-2.png" alt="Asesora 2">
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const carouselImages = document.querySelectorAll('.crossfade-carousel img');
            if (carouselImages.length > 0) {
                let currentImageIndex = 0;
                setInterval(() => {
                    carouselImages[currentImageIndex].classList.remove('active');
                    currentImageIndex = (currentImageIndex + 1) % carouselImages.length;
                    carouselImages[currentImageIndex].classList.add('active');
                    console.log("Switched to image " + currentImageIndex);
                }, 500); // 0.5 seconds
            } else {
                console.log("No images found");
            }
        });
    </script>
</body>
</html>
